version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    groups:
      stellar:
        patterns:
          - "@stellar/*"
      react:
        patterns:
          - "react*"
          - "@types/react*"

  - package-ecosystem: cargo
    directory: /contracts
    schedule:
      interval: weekly

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
